<div *ngIf="lesson; else loading" class="lesson-container">

  <!-- Header -->
  <div class="lesson-header">
    <div class="header-content">
      <a routerLink="/admin/lessons" class="back-link">
        ← Back to Lessons
      </a>
      <h1 class="lesson-title">{{ lesson.title }}</h1>
      <p class="lesson-meta">Created: {{ lesson.createdAt | date:'MMM d, yyyy' }}</p>
    </div>
  </div>

  <!-- Main Content Wrapper -->
  <div class="lesson-content-wrapper">

    <!-- Description Section -->
    <div *ngIf="lesson.description" class="section description-section">
      <div class="section-header">
        <h2 class="section-title">Overview</h2>
      </div>
      <p class="description">{{ lesson.description }}</p>
    </div>

    <!-- Audio Player Section -->
    <div *ngIf="lesson.audioUrl" class="section audio-section">
      <div class="section-header">
        <h2 class="section-title">Lesson Audio</h2>
      </div>
      <div class="audio-player">
        <audio controls preload="metadata" class="audio-element">
          <source [src]="audioUrl" type="audio/mpeg">
          Your browser does not support audio playback.
        </audio>
      </div>
    </div>

    <!-- Main Content Section -->
    <div class="section content-section">
      <div class="section-header">
        <h2 class="section-title">Lesson Content</h2>
      </div>
      <div class="content-display" [innerHTML]="lesson.content"></div>
    </div>

    <!-- Instructions Section -->
    <div *ngIf="lesson.instructions" class="section instructions-section">
      <div class="section-header">
        <h2 class="section-title">Instructions</h2>
      </div>
      <p class="instructions">{{ lesson.instructions }}</p>
    </div>

    <!-- Notes Section -->
    <div *ngIf="lesson.notes" class="section notes-section">
      <div class="section-header">
        <h2 class="section-title">Notes</h2>
      </div>
      <p class="notes">{{ lesson.notes }}</p>
    </div>

  </div>

  <!-- Footer Actions -->
  <div class="lesson-footer">
    <a routerLink="/admin/lessons" class="btn btn-secondary">
      ← Back to Lessons
    </a>
    <a [routerLink]="['/admin/lessons', lesson.id, 'edit']" class="btn btn-primary">
      Edit Lesson
    </a>
  </div>

</div>

<!-- Loading State -->
<ng-template #loading>
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Loading lesson details...</p>
  </div>
</ng-template>
