<div *ngIf="lesson; else loading" class="lesson-container">

  <!-- Lesson Header -->
  <div class="lesson-header">
    <h2>{{ lesson.title }}</h2>
  </div>

  <!-- Audio Player -->
  <div class="audio-player-container" *ngIf="audioUrl">
    <div class="audio-player">
      <svg class="audio-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" />
      </svg>
      <span class="audio-label">Listen to this lesson</span>
      <audio controls preload="metadata">
        <source [src]="audioUrl" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>
  </div>

  <div class="description-container" *ngIf="lesson.description">
    <p class="description">
      <svg class="callout-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
      <span>{{ lesson.description }}</span>
    </p>
  </div>

  <!-- Memorization Reminder -->
  <div class="memorize-reminder">
    <span class="memorize-icon">🚨</span>
    <span>You need to memorize this text before the next class.</span>
     <span class="memorize-icon">🚨</span>
  </div>

  <!-- Main Content -->
  <div class="content" [innerHTML]="lesson.content"></div>

  <div class="description-container" *ngIf="lesson.instructions">
    <h3>What to expect next class</h3>
    
    <div class="instructions">
      <svg class="callout-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <div class="instructions-text">{{ lesson.instructions }}</div>
    </div>

  </div>

  <!-- Back Button -->
  <div class="back-btn-row">
    <a routerLink="/dashboard" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12" />
        <polyline points="12 19 5 12 12 5" />
      </svg>
      Back to Dashboard
    </a>
  </div>

</div>

<!-- Loading Skeleton -->
<ng-template #loading>

  <div class="lesson-container lesson-skeleton">

    <!-- Lesson Header -->
    <div class="lesson-header">
      <div class="skeleton skeleton-title"></div>
    </div>

    <!-- Audio Player -->
    <div class="audio-player-container">
      <div class="audio-player skeleton-audio">
        <div class="skeleton skeleton-audio-icon"></div>
        <div class="skeleton skeleton-audio-label"></div>
        <div class="skeleton skeleton-audio-controls"></div>
      </div>
    </div>

    <!-- Description -->
    <div class="description-container">
      <div class="skeleton-description">
        <div class="skeleton skeleton-description-icon"></div>

        <div class="skeleton-description-text">
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>
      </div>
    </div>

    <!-- Memorization Reminder -->
    <div class="memorize-reminder skeleton-reminder">
      <div class="skeleton skeleton-reminder-icon"></div>
      <div class="skeleton skeleton-reminder-text"></div>
      <div class="skeleton skeleton-reminder-icon"></div>
    </div>

    <!-- Main Lesson Content -->
    <div class="content skeleton-content">

      <div class="skeleton skeleton-content-heading"></div>

      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line medium"></div>

      <div class="skeleton skeleton-content-heading second"></div>

      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>

      <div class="skeleton skeleton-content-box"></div>

    </div>

    <!-- What to expect -->
    <div class="description-container skeleton-instructions">

      <div class="skeleton skeleton-instructions-title"></div>

      <div class="instructions">
        <div class="skeleton skeleton-instructions-icon"></div>

        <div class="skeleton-description-text">
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line medium"></div>
        </div>
      </div>

    </div>

    <!-- Back Button -->
    <div class="back-btn-row">
      <div class="skeleton skeleton-back-button"></div>
    </div>

  </div>

</ng-template>
