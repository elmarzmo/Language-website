<div *ngIf="lesson; else loading" class="lesson-container">
  
  <!-- Lesson Header with Audio Controls -->
  <div class="lesson-header">
    <div>
      <h2>{{ lesson.title }}</h2>
    </div>
    
    <div class="audio-player" *ngIf="audioUrl">
      <audio controls preload="metadata">
        <source [src]="audioUrl" type="audio/mpeg">
        Your browser does not support audio playback.
      </audio>
    </div>


  </div>
  <div class="description-container" *ngIf="lesson.description">
     <p class="description">{{ lesson.description }}</p>
  </div>
    <!-- Main Content --> 
  <div class="content" [innerHTML]="lesson.content"></div>

  <!-- Description (Now centered) -->


  <div class="description-container" *ngIf="lesson.instructions">
      <h3> What to expect next class</h3>
     <p class="instructions">{{ lesson.instructions }}</p>
  </div>


  <!-- Back Button -->
  <div style="max-width: 900px; margin: 0 auto;">
    <a routerLink="/dashboard" class="back-btn">
      ← Back to Dashboard
    </a>
  </div>

</div>

<!-- Loading Template -->
<ng-template #loading>
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Loading lesson details...</p>
  </div>
</ng-template>
