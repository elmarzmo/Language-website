<div class="reset-container">
  <div class="reset-card">
    
    <!-- Header Section -->
    <div class="header">
      <h1 class="brand-title">Voixa English</h1>
      <h2 class="page-title">Create a New Password</h2>
      <p class="subtitle">This reset link expires after 15 minutes.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="success" class="success-state">
      <div class="alert alert-success">
        Your password has been reset successfully!
      </div>
      <a routerLink="/signin" class="btn btn-primary btn-block">Sign In Now</a>
    </div>

    <!-- Form State -->
    <form *ngIf="!success" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      
      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <input 
          id="new-password" 
          type="password" 
          formControlName="newPassword" 
          placeholder="At least 6 characters" 
        />
        <!-- Field Level Errors -->
        <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid" class="error-text">
          <span *ngIf="resetForm.get('newPassword')?.errors?.['required']">Password is required.</span>
          <span *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">Must be at least 6 characters.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input 
          id="confirm-password" 
          type="password" 
          formControlName="confirmPassword" 
          placeholder="Repeat new password" 
        />
        <!-- Match Error -->
        <div *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('mismatch')" class="error-text">
          Passwords do not match.
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="loading || resetForm.invalid || !token" 
        class="btn btn-primary btn-block">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <!-- Footer Navigation -->
    <div class="footer">
      <p>Already remembered it? <a routerLink="/signin">Back to Sign In</a></p>
    </div>

  </div>
</div>
